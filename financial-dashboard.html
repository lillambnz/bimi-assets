<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Financial Dashboard - Build Your Wealth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .card h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .card .amount {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .card .subtitle-text {
            opacity: 0.9;
            font-size: 0.9em;
        }

        .income-card { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .expense-card { background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%); }
        .savings-card { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .goal-card { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }

        .input-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .input-section h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input, select, textarea {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .transactions-list {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .transaction-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .transaction-item.income {
            border-left: 4px solid #38ef7d;
        }

        .transaction-item.expense {
            border-left: 4px solid #f45c43;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-category {
            color: #666;
            font-size: 0.9em;
            margin-top: 3px;
        }

        .transaction-amount {
            font-size: 1.3em;
            font-weight: bold;
        }

        .transaction-amount.income {
            color: #38ef7d;
        }

        .transaction-amount.expense {
            color: #f45c43;
        }

        .delete-btn {
            background: #f45c43;
            padding: 8px 15px;
            font-size: 0.9em;
            margin-left: 10px;
        }

        .goals-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .goal-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .goal-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
        }

        .goal-progress {
            color: #667eea;
            font-weight: 600;
        }

        .progress-bar {
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .insights {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }

        .insights h2 {
            color: #d4543e;
            margin-bottom: 15px;
        }

        .insight-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #d4543e;
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Family Financial Dashboard</h1>
        <p class="subtitle">Track, Plan, and Build Your Family's Wealth</p>

        <!-- Dashboard Cards -->
        <div class="dashboard-grid">
            <div class="card income-card">
                <h3>📈 Total Income</h3>
                <div class="amount" id="totalIncome">$0.00</div>
                <div class="subtitle-text">This month</div>
            </div>

            <div class="card expense-card">
                <h3>📊 Total Expenses</h3>
                <div class="amount" id="totalExpenses">$0.00</div>
                <div class="subtitle-text">This month</div>
            </div>

            <div class="card savings-card">
                <h3>💎 Net Savings</h3>
                <div class="amount" id="netSavings">$0.00</div>
                <div class="subtitle-text">Income - Expenses</div>
            </div>

            <div class="card goal-card">
                <h3>🎯 Savings Rate</h3>
                <div class="amount" id="savingsRate">0%</div>
                <div class="subtitle-text">Target: 20%+</div>
            </div>
        </div>

        <!-- Add Transaction -->
        <div class="input-section">
            <h2>💵 Add Transaction</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Type</label>
                    <select id="transactionType">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Amount ($)</label>
                    <input type="number" id="amount" placeholder="100.00" step="0.01" min="0">
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="category">
                        <optgroup label="Income">
                            <option value="Salary">Salary</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Side Hustle">Side Hustle</option>
                            <option value="Investment">Investment</option>
                            <option value="Other Income">Other Income</option>
                        </optgroup>
                        <optgroup label="Expenses">
                            <option value="Housing">Housing</option>
                            <option value="Food">Food</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Education">Education</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Other Expense">Other Expense</option>
                        </optgroup>
                    </select>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="description" placeholder="e.g., Monthly salary, Groceries">
                </div>
            </div>
            <button onclick="addTransaction()">➕ Add Transaction</button>
        </div>

        <!-- Recent Transactions -->
        <div class="transactions-list">
            <h2>📋 Recent Transactions</h2>
            <div id="transactionsList"></div>
        </div>

        <!-- Savings Goals -->
        <div class="goals-section">
            <h2>🎯 Savings Goals</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Goal Name</label>
                    <input type="text" id="goalName" placeholder="e.g., Emergency Fund, Vacation">
                </div>

                <div class="form-group">
                    <label>Target Amount ($)</label>
                    <input type="number" id="goalAmount" placeholder="5000" min="0">
                </div>

                <div class="form-group">
                    <label>Current Saved ($)</label>
                    <input type="number" id="goalCurrent" placeholder="1000" min="0">
                </div>
            </div>
            <button onclick="addGoal()">🎯 Add Goal</button>

            <div id="goalsList" style="margin-top: 20px;"></div>
        </div>

        <!-- AI Insights -->
        <div class="insights">
            <h2>🧠 Financial Insights</h2>
            <div id="insightsList"></div>
        </div>
    </div>

    <script>
        // Data storage
        let transactions = JSON.parse(localStorage.getItem('transactions') || '[]');
        let goals = JSON.parse(localStorage.getItem('goals') || '[]');

        // Initialize dashboard
        function init() {
            updateDashboard();
            renderTransactions();
            renderGoals();
            generateInsights();
        }

        // Add transaction
        function addTransaction() {
            const type = document.getElementById('transactionType').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value;

            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            const transaction = {
                id: Date.now(),
                type,
                amount,
                category,
                description: description || category,
                date: new Date().toISOString()
            };

            transactions.unshift(transaction);
            localStorage.setItem('transactions', JSON.stringify(transactions));

            // Reset form
            document.getElementById('amount').value = '';
            document.getElementById('description').value = '';

            updateDashboard();
            renderTransactions();
            generateInsights();
        }

        // Delete transaction
        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            localStorage.setItem('transactions', JSON.stringify(transactions));
            updateDashboard();
            renderTransactions();
            generateInsights();
        }

        // Update dashboard cards
        function updateDashboard() {
            const income = transactions
                .filter(t => t.type === 'income')
                .reduce((sum, t) => sum + t.amount, 0);

            const expenses = transactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + t.amount, 0);

            const savings = income - expenses;
            const savingsRate = income > 0 ? ((savings / income) * 100).toFixed(1) : 0;

            document.getElementById('totalIncome').textContent = `$${income.toFixed(2)}`;
            document.getElementById('totalExpenses').textContent = `$${expenses.toFixed(2)}`;
            document.getElementById('netSavings').textContent = `$${savings.toFixed(2)}`;
            document.getElementById('savingsRate').textContent = `${savingsRate}%`;
        }

        // Render transactions list
        function renderTransactions() {
            const list = document.getElementById('transactionsList');

            if (transactions.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #666;">No transactions yet. Start tracking your finances!</p>';
                return;
            }

            list.innerHTML = transactions.slice(0, 20).map(t => `
                <div class="transaction-item ${t.type}">
                    <div class="transaction-info">
                        <div><strong>${t.description}</strong></div>
                        <div class="transaction-category">${t.category} • ${new Date(t.date).toLocaleDateString()}</div>
                    </div>
                    <div style="display: flex; align-items: center;">
                        <div class="transaction-amount ${t.type}">
                            ${t.type === 'income' ? '+' : '-'}$${t.amount.toFixed(2)}
                        </div>
                        <button class="delete-btn" onclick="deleteTransaction(${t.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Add goal
        function addGoal() {
            const name = document.getElementById('goalName').value;
            const target = parseFloat(document.getElementById('goalAmount').value);
            const current = parseFloat(document.getElementById('goalCurrent').value) || 0;

            if (!name || !target || target <= 0) {
                alert('Please enter valid goal details');
                return;
            }

            const goal = {
                id: Date.now(),
                name,
                target,
                current
            };

            goals.push(goal);
            localStorage.setItem('goals', JSON.stringify(goals));

            // Reset form
            document.getElementById('goalName').value = '';
            document.getElementById('goalAmount').value = '';
            document.getElementById('goalCurrent').value = '';

            renderGoals();
        }

        // Delete goal
        function deleteGoal(id) {
            goals = goals.filter(g => g.id !== id);
            localStorage.setItem('goals', JSON.stringify(goals));
            renderGoals();
        }

        // Render goals
        function renderGoals() {
            const list = document.getElementById('goalsList');

            if (goals.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #666;">No goals set yet. Create your first savings goal!</p>';
                return;
            }

            list.innerHTML = goals.map(g => {
                const progress = Math.min((g.current / g.target) * 100, 100);
                return `
                    <div class="goal-item">
                        <div class="goal-header">
                            <div class="goal-name">${g.name}</div>
                            <div class="goal-progress">${progress.toFixed(1)}%</div>
                        </div>
                        <div>$${g.current.toFixed(2)} / $${g.target.toFixed(2)}</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                        <button class="delete-btn" onclick="deleteGoal(${g.id})" style="margin-top: 10px;">Delete Goal</button>
                    </div>
                `;
            }).join('');
        }

        // Generate insights
        function generateInsights() {
            const insights = [];
            const income = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
            const expenses = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
            const savings = income - expenses;

            if (income === 0 && expenses === 0) {
                insights.push('Start by adding your income and expenses to get personalized insights!');
            } else {
                // Savings rate insight
                const savingsRate = income > 0 ? (savings / income) * 100 : 0;
                if (savingsRate >= 20) {
                    insights.push(`Excellent! Your ${savingsRate.toFixed(1)}% savings rate is above the recommended 20%. Keep it up!`);
                } else if (savingsRate > 0) {
                    insights.push(`Your savings rate is ${savingsRate.toFixed(1)}%. Try to aim for 20% or higher for faster wealth building.`);
                } else {
                    insights.push(`⚠️ Warning: You're spending more than you earn. Review your expenses to find areas to cut.`);
                }

                // Expense analysis
                const expensesByCategory = {};
                transactions.filter(t => t.type === 'expense').forEach(t => {
                    expensesByCategory[t.category] = (expensesByCategory[t.category] || 0) + t.amount;
                });

                const topExpense = Object.entries(expensesByCategory).sort((a, b) => b[1] - a[1])[0];
                if (topExpense) {
                    insights.push(`Your biggest expense category is ${topExpense[0]} at $${topExpense[1].toFixed(2)}. Look for ways to optimize this.`);
                }

                // Income diversity
                const incomeCategories = new Set(transactions.filter(t => t.type === 'income').map(t => t.category));
                if (incomeCategories.size === 1) {
                    insights.push('💡 Consider diversifying your income streams with side hustles or investments for financial security.');
                } else if (incomeCategories.size >= 3) {
                    insights.push(`Great job! You have ${incomeCategories.size} different income streams. This reduces financial risk.`);
                }

                // Monthly projection
                if (savings > 0) {
                    const yearlyProjection = savings * 12;
                    insights.push(`📊 At this rate, you'll save $${yearlyProjection.toFixed(2)} this year. That's real wealth building!`);
                }
            }

            document.getElementById('insightsList').innerHTML = insights.map(insight =>
                `<div class="insight-item">${insight}</div>`
            ).join('');
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
